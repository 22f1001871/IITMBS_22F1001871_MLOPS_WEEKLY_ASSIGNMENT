name: IRIS CI/CD Pipeline

on:
  push:
    branches:
      - week_7

  pull_request:
    branches:
      - week_7

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc dvc-gs
          pip install pytest
          npm install -g @dvcorg/cml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Pull DVC Data
        run: dvc pull

      - name: Run Tests
        run: |
          pytest -v | tee report.txt

      - name: Evaluate Model
        run: |
          python evaluate.py

      - name: Create CML Report
        run: |
          echo "# IRIS CI Report" > report.md
          echo "" >> report.md

          echo "## Model Evaluation Metrics" >> report.md
          echo "" >> report.md

          python - <<EOF >> report.md
          import json

          with open("metrics.json") as f:
              m = json.load(f)

          print("| Metric | Value |")
          print("|--------|------:|")
          print(f"| Accuracy | {m['accuracy']:.4f} |")
          print(f"| Precision | {m['precision']:.4f} |")
          print(f"| Recall | {m['recall']:.4f} |")
          print(f"| F1 Score | {m['f1_score']:.4f} |")
          EOF

          echo "" >> report.md
          echo "## Pytest Results" >> report.md
          echo "" >> report.md
          echo '```' >> report.md
          cat report.txt >> report.md
          echo '```' >> report.md

      - name: Comment PR with CML
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md

  cd:
    name: Continuous Deployment
    needs: ci

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/iitm-mlops-assignments/iris-repo/iris-api:latest .

      - name: Push Docker Image
        run: |
          docker push \
            us-central1-docker.pkg.dev/iitm-mlops-assignments/iris-repo/iris-api:latest

      - name: Enable GKE Auth Plugin
        run: |
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials iris-cluster \
            --region us-central1

      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Restart Deployment
        run: |
          kubectl rollout restart deployment iris-api
          kubectl rollout status deployment iris-api --timeout=300s

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get service

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Stress Test
        run: |
          wrk -t4 -c1000 -d30s http://${{ secrets.EXTERNAL_IP }}/predict
