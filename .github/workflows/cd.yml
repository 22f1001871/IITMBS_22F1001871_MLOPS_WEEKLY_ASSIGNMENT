name: IRIS CD Pipeline

on:
  push:
    branches:
      - week_6

permissions:
  contents: read

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4


    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'
        
    
    - name: Setup Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        install_components: gke-gcloud-auth-plugin


    - name: Configure Docker Authentication
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev


    - name: Build Docker Image
      run: |
        docker build \
        -t us-central1-docker.pkg.dev/iitm-mlops-assignments/iris-repo/iris-api:latest .


    - name: Push Docker Image
      run: |
        docker push \
        us-central1-docker.pkg.dev/iitm-mlops-assignments/iris-repo/iris-api:latest
      
    - name: Configure GKE Authentication
      run: |
       echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

    - name: Get GKE Credentials
      run: |
        gcloud container clusters get-credentials iris-cluster \
        --region us-central1


    - name: Deploy to GKE
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml


    - name: Restart Deployment
      run: |
        kubectl rollout restart deployment iris-api
