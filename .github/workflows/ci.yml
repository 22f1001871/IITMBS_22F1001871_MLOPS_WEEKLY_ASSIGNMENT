name: IRIS CI Pipeline

on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{secrets.MLFLOW_TRACKING_URI}}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              npm install -g @dvcorg/cml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Pull DVC Data
        run: dvc pull
        
      - name: Test MLflow connectivity
        run: |
             echo "URI: $MLFLOW_TRACKING_URI"

             curl -v $MLFLOW_TRACKING_URI

             curl -v $MLFLOW_TRACKING_URI/api/2.0/mlflow/registered-models/search

      - name: Run Tests
        run: |
              pytest -v | tee report.txt

      - name: Debug MLflow URI
        run: |
             echo "MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI"

      - name: Evaluate Model
        run: |
              python evaluate.py

      - name: Create CML Report
        run: |
              echo "# IRIS CI Report" > report.md
              echo "" >> report.md

              echo "## Model Evaluation Metrics" >> report.md
              echo "" >> report.md

              python - <<EOF >> report.md
              import json

              with open("metrics.json") as f:
                  m = json.load(f)

              print("| Metric | Value |")
              print("|--------|------:|")
              print(f"| Accuracy | {m['accuracy']:.4f} |")
              print(f"| Precision | {m['precision']:.4f} |")
              print(f"| Recall | {m['recall']:.4f} |")
              print(f"| F1 Score | {m['f1_score']:.4f} |")
              EOF

              echo "" >> report.md
              echo "## Pytest Results" >> report.md
              echo "" >> report.md
              echo '```' >> report.md
              cat report.txt >> report.md
              echo '```' >> report.md 

      - name: Comment PR with CML
        if: github.event_name == 'pull_request'
        env:
              REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
              cml comment create report.md
