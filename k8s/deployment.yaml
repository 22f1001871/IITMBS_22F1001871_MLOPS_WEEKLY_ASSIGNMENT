apiVersion: apps/v1
kind: Deployment

metadata:
  name: iris-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: iris-api

  template:
    metadata:
      labels:
        app: iris-api

    spec:
      containers:
      - name: iris-api

        image: us-central1-docker.pkg.dev/iitm-mlops-assignments/iris-repo/iris-api:latest

        ports:
        - containerPort: 5000
